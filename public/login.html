<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Connexion</h1>
  <form id="loginForm">
    <label>Email : <input type="email" name="email" required></label><br>
    <label>Mot de passe : <input type="password" name="password" required></label><br>
    <button type="submit">Se connecter</button><p>Pas encore inscrit ? <a href="register.html">Créer un compte</a></p>
  </form>

  <pre id="result"></pre>

  <script type="module">
    import axios from 'https://cdn.jsdelivr.net/npm/axios@1.6.8/+esm';

    // Si déjà connecté, rediriger
    if (localStorage.getItem('jwt')) {
      window.location.href = 'game.html';
    }

    const form = document.getElementById('loginForm');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const payload = {
        email: formData.get('email'),
        password: formData.get('password')
      };

      try {
        const res = await axios.post('https://localhost/api/login', payload, {
          headers: { 'Content-Type': 'application/ld+json' }
        });

        localStorage.setItem('jwt', res.data.token);
        window.location.href = 'game.html'; // ✅ redirection vers la page protégée
      } catch (err) {
        result.textContent = `Erreur : ${err.response?.data?.detail || err.message}`;
      }
    });
  </script>
</body>
</html>
